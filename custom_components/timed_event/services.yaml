schedule:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    action:
      required: true
      example: switch.turn_off
      selector:
        text:
    data:
      required: false
      example: '{"brightness_pct": 50}'
      selector:
        object:
    delay:
      required: false
      example: "00:30:00"
      selector:
        duration:
    at:
      required: false
      example: "2026-10-27 07:00:00"
      selector:
        datetime:
    repeat:
      required: false
      default: false
      selector:
        boolean:
    weekdays:
      required: false
      example: '["mon", "tue", "wed", "thu", "fri"]'
      selector:
        select:
          multiple: true
          mode: list
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun

cancel:
  fields:
    timer_id:
      required: false
      selector:
        text:
    entity_id:
      required: false
      selector:
        entity:
